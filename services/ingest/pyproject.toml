[project]
name = "polypredictor-ingest"
version = "0.0.1"
description = "PolyPredictor ingestion workers — Gamma discovery, CLOB polling, WSS bridge, DLQ."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "clickhouse-connect>=0.7",
    "asyncpg>=0.29",
    "redis>=5.0",
    "structlog>=24.4",
    "websockets>=13.0",
    "polymarket-client",
    "polypredictor-model",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
