[project]
name = "polypredictor-model"
version = "0.0.1"
description = "Market-type classifier + principled baselines (PRD §6.1 / §6.2)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "numpy>=2.0",
    "scipy>=1.14",
    "httpx>=0.27",
    "structlog>=24.4",
    "polymarket-client",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model"]
