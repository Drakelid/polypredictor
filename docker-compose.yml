services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polypredictor}
      POSTGRES_USER: ${POSTGRES_USER:-polypredictor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polypredictor_dev}
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./services/ingest/migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polypredictor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-polypredictor}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    expose:
      - "8123"
      - "9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ch_logs:/var/log/clickhouse-server
      - ./services/ingest/migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-polypredictor}
      POSTGRES_USER: ${POSTGRES_USER:-polypredictor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polypredictor_dev}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-polypredictor}
      REDIS_URL: redis://redis:6379/0
      USER_SECRET_ENCRYPTION_KEY_B64: ${USER_SECRET_ENCRYPTION_KEY_B64:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-mock-price-id}
      BILLING_MONTHLY_PRICE_USD: ${BILLING_MONTHLY_PRICE_USD:-49}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_BASE: http://api:8000
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - api

  ingest-gamma:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    command: ["python", "-m", "ingest.workers.gamma_discovery"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-polypredictor}
      POSTGRES_USER: ${POSTGRES_USER:-polypredictor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polypredictor_dev}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-polypredictor}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest-x:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    command: ["python", "-m", "ingest.workers.x_ingest"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-polypredictor}
      POSTGRES_USER: ${POSTGRES_USER:-polypredictor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polypredictor_dev}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-polypredictor}
      REDIS_URL: redis://redis:6379/0
      USER_SECRET_ENCRYPTION_KEY_B64: ${USER_SECRET_ENCRYPTION_KEY_B64:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      X_FILTERED_STREAM_RULES_FILE: ${X_FILTERED_STREAM_RULES_FILE:-}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  ch_data:
  ch_logs:
  redis_data:
