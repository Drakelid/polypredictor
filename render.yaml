  - type: worker
    name: polypredictor-ingest-x-staging
    runtime: docker
    plan: starter
    dockerfilePath: ./services/ingest/Dockerfile
    dockerContext: .
    dockerCommand: python -m ingest.workers.x_ingest
    envVars: *ingestEnv

  - type: worker
    name: polypredictor-ingest-scheduled-events-staging
    runtime: docker
    plan: starter
    dockerfilePath: ./services/ingest/Dockerfile
    dockerContext: .
    dockerCommand: python -m ingest.workers.scheduled_events_ingest
    envVars: *ingestEnv

  - type: worker
    name: polypredictor-ingest-deribit-iv-staging
    runtime: docker
    plan: starter
    dockerfilePath: ./services/ingest/Dockerfile
    dockerContext: .
    dockerCommand: python -m ingest.workers.deribit_iv_surface
    envVars: *ingestEnv

  - type: worker
    name: polypredictor-ingest-spot-validation-staging
