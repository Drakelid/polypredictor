  - type: worker
    name: polypredictor-ingest-regime-staging
    runtime: docker
    plan: starter
    dockerfilePath: ./services/ingest/Dockerfile
    dockerContext: .
    dockerCommand: python -m ingest.workers.regime_tagger
    envVars: *ingestEnv

  - type: keyvalue
    name: polypredictor-redis-staging
    plan: starter
    ipAllowList: []

databases:
  - name: polypredictor-postgres-staging
    plan: starter
    databaseName: polypredictor
    user: polypredictor
