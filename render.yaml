  - type: worker
    name: polypredictor-ingest-onchain-metrics-staging
    runtime: docker
    plan: starter
    dockerfilePath: ./services/ingest/Dockerfile
    dockerContext: .
    dockerCommand: python -m ingest.workers.onchain_metrics
    envVars: *ingestEnv

  - type: worker
    name: polypredictor-ingest-holders-staging
    runtime: docker
    plan: starter
    dockerfilePath: ./services/ingest/Dockerfile
    dockerContext: .
    dockerCommand: python -m ingest.workers.holders_poller
    envVars: *ingestEnv

  - type: worker
    name: polypredictor-ingest-trades-staging
    runtime: docker
    plan: starter
    dockerfilePath: ./services/ingest/Dockerfile
    dockerContext: .
    dockerCommand: python -m ingest.workers.trades_sweeper
    envVars: *ingestEnv

  - type: worker
    name: polypredictor-ingest-prices-history-staging
    runtime: docker
